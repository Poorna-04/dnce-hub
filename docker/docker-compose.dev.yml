# Overlay: Next.js `next dev` with bind-mounted source (hot reload).
# Caddy / postgres / redis / backend stay as in docker-compose.yml.
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up --build

services:
  frontend:
    image: node:20-alpine
    build: !reset
    working_dir: /app
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      SPRING_BASE_URL: http://backend:8080/api/v1
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
