# Local / droplet-shaped stack. Caddy is the only published HTTP entrypoint.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# App + API:  http://localhost
# Health:     http://localhost/api/v1/health
#
# Do not publish 3000/8080 — the browser talks to Caddy, same as a droplet.

name: dncehub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dancehub
      POSTGRES_USER: dancehub
      POSTGRES_PASSWORD: dancehub_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dancehub -d dancehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dancehub
      SPRING_DATASOURCE_USERNAME: dancehub
      SPRING_DATASOURCE_PASSWORD: dancehub_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Local compose only — rotate before a public droplet.
      JWT_SECRET: pCTiGbtD+1cgGQqSfhc1TC9jNqokVsJTlwre0UOLzRM=
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        SPRING_BASE_URL: http://backend:8080/api/v1
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SPRING_BASE_URL: http://backend:8080/api/v1

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
