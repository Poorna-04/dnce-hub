server:
  port: 8080

spring:
  application:
    name: dncehub-backend
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  cache:
    instructors-ttl-seconds: 300   # 5 minutes
    workshops-ttl-seconds: 180     # 3 minutes
    single-item-ttl-seconds: 600   # 10 minutes
  jwt:
    secret: XRcEs8FnQe5PVZAHTK02rBzRajR+Tb2nj8gXLsoyPYQ=
    access-token-expiry-ms: 900000      # 15 minutes
    refresh-token-expiry-ms: 604800000  # 7 days
