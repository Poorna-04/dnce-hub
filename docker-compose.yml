# Full stack with the production Dockerfiles.
#
#   docker compose up --build
#
# App:            http://localhost:3000
# API / Swagger:  http://localhost:8080/swagger-ui.html
#
# Frontend hot-reload instead of the standalone image:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dancehub
      POSTGRES_USER: dancehub
      POSTGRES_PASSWORD: dancehub_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dancehub -d dancehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dancehub
      SPRING_DATASOURCE_USERNAME: dancehub
      SPRING_DATASOURCE_PASSWORD: dancehub_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Local compose only — not for Cloud Run / Neon.
      JWT_SECRET: pCTiGbtD+1cgGQqSfhc1TC9jNqokVsJTlwre0UOLzRM=
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        SPRING_BASE_URL: http://backend:8080/api/v1
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SPRING_BASE_URL: http://backend:8080/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
